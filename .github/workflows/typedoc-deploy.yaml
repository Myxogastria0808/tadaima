name: typedoc-deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Install dependencies
        run: nix develop --command bash -c "pnpm install"
      - name: Generate type definitions
        run: nix develop --command bash -c "pnpm i && pnpm run types"
      - name: Build Typedoc
        run: nix develop --command bash -c "pnpm run typedoc:build"
      - name: Deploy Typedoc to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api

