name: wiki-deploy

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Install Nix
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      # Build
      - name: Build
        run: nix develop --command bash -c "pnpm i && pnpm run wiki:build"
      # Deploy Wiki to Cloudflare Workers
      # Note: uses npm (not pnpm) to install wrangler because pnpm's store
      # conflicts between nix develop and pnpm/action-setup.
      - name: Deploy Wiki to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          packageManager: npm
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "docs/wiki"

