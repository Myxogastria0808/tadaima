name: tadaima-cli test

permissions:
  contents: read

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Install Dependencies
        run: nix develop --command bash -c "pnpm install"
      - name: Test (Only tadaima-cli Test)
        run: nix develop --command bash -c "pnpm run tadaima-cli:test"
