name: ci

permissions:
  contents: read

on:
  pull_request:
    branches: ['main']

jobs:
  lint-and-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Install dependencies
        run: nix develop --command bash -c "pnpm install"
      - name: Lint check
        run: nix develop --command bash -c "pnpm run lint:check"
      - name: Format check
        run: nix develop --command bash -c "pnpm run fmt:check"
      - name: Test (only tadaima-cli test)
        run: nix develop --command bash -c "pnpm run tadaima-cli:test"

