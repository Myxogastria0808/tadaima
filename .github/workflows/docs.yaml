name: docs

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Install Dependencies
        run: nix develop --command bash -c "pnpm install"
      - name: Generate Type Definitions
        run: nix develop --command bash -c "pnpm run ags:types"
      - name: Build Typedoc (tadaima)
        run: nix develop --command bash -c "pnpm run tadaima:typedoc:build"
      - name: Build Typedoc (create-tadaima)
        run: nix develop --command bash -c "pnpm run create-tadaima:typedoc:build"
      - name: Assemble Publish Directory
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          cp -r packages/tadaima/docs _site/tadaima
          cp -r packages/create-tadaima/docs _site/create-tadaima
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
