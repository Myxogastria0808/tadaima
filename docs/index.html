<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadaima API References</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      h1 {
        font-size: 2.4rem;
        font-weight: 600;
        color: #fff;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        align-items: center;
      }
      .cards a {
        display: flex;
        flex-direction: column;
        width: 420px;
        padding: 2rem 2.5rem;
        background: #242b45;
        border: 1px solid #3a4a6c;
        border-radius: 8px;
        color: #a8d8ea;
        text-decoration: none;
        font-size: 1.25rem;
        transition:
          background 0.2s,
          border-color 0.2s;
      }
      .cards a:hover {
        background: #2e3a5a;
        border-color: #a8d8ea;
      }
      .cards a span {
        display: block;
        font-size: 1rem;
        color: #888;
        margin-top: 0.4rem;
      }
    </style>
  </head>
  <body>
    <h1>Tadaima API References</h1>
    <div class="cards">
      <a href="./tadaima/">
        @myxogastria0808/tadaima
        <span>Greeter library for AGS/GJS</span>
      </a>
      <a href="./create-tadaima/">
        @myxogastria0808/create-tadaima
        <span>CLI scaffolding tool</span>
      </a>
    </div>
  </body>
</html>
